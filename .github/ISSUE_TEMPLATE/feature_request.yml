name: Feature request
description: Something Nakka should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests describe the problem rather than the solution.
        Knowing what you were trying to get done leaves room for an answer
        neither of us has thought of yet.

  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: The situation, not the feature.
      placeholder: |
        I work across two repos at once and I keep having to tell it which one
        a file is in.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: If you have something in mind. Leave it blank if you do not.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: >
        How you work around it now, and what that costs you. This is often what
        decides whether something is worth building.
    validations:
      required: false
